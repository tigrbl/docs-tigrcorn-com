apiVersion: npmctl.com/v1
schemaVersion: 2

proxy_hosts:
  - domain_names:
      - "docs.tigrcorn.com.localhost"
    forward_scheme: http
    forward_host: docs-tigrcorn-com
    forward_port: 80
    ssl_forced: 0
    http2_support: 0
    hsts_enabled: 0
    hsts_subdomains: 0
    allow_websocket_upgrade: 1
    block_exploits: 1
    meta:
      managed_by: npmctl
      owner: docs-tigrcorn-com
      resource_id: proxy.docs-tigrcorn-com.development
